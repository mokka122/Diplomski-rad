# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:

  # ====================================================================================
  # REDIS
  # ====================================================================================

  redis:
    image: redis:7-alpine
    container_name: oceaneye-redis

    ports:
      - "6379:6379"

    # AOF persistence:
    # Redis writes changes to disk so live traffic history survives
    # container recreation and docker compose down/up.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

    volumes:
      - oceaneye_redis_data:/data

    restart: unless-stopped


  # ====================================================================================
  # KAFKA
  # ====================================================================================

  kafka:
    image: apache/kafka:4.3.1
    container_name: oceaneye-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 1

    restart: unless-stopped


  # ====================================================================================
  # ELASTICSEARCH
  # ====================================================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: oceaneye-elasticsearch

    ports:
      - "9200:9200"

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    restart: unless-stopped


# ======================================================================================
# PERSISTENT VOLUMES
# ======================================================================================

volumes:

  oceaneye_redis_data:
    name: oceaneye-redis-data